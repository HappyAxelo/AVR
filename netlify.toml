[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so a Netlify default change cannot break the build later.
  NODE_VERSION = "20"

# ---------------------------------------------------------------
# Client-side routing. Netlify serves a real file when one exists,
# so /assets/* is unaffected; everything else falls through to the
# app, which is what makes /news/:slug and /work/:slug work on a
# hard refresh or when opened from an email link.
# ---------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # No max-age=preload: preloading is effectively irreversible and the
    # custom domain is not settled yet.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://api.fontshare.com; \
      font-src 'self' data: https://cdn.fontshare.com; \
      img-src 'self' data: blob: https://vusbutgfaivhodtztsxm.supabase.co; \
      connect-src 'self' https://vusbutgfaivhodtztsxm.supabase.co; \
      form-action 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'"""

# Filenames are content-hashed, so a given URL's bytes never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry point must never be cached, or a deploy will not be picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
